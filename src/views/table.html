<!-- =============================================================================
     VIEW: DATA MANAGEMENT TABLE
     =============================================================================
     Lessons on this page:
       1. toolbar          search input (icon-inset) + status filter chips
       2. responsive table overflow-x-auto wrapper + min-w-full
       3. zebra striping   even:bg-gray-50 (CSS nth-child — zero JS)
       4. status pills     rounded-full micro-badges (Active/Inactive)
       5. avatar stack     flex -space-x-2 + ring notch
       6. pagination       real: 42 members / 8 per page = 6 pages

     ROWS ARE NOT IN THIS FILE. tbody starts empty; main.js initTable()
     renders the current page from a 42-entry dataset and wires search,
     chips, pagination and the empty state. That's how every data table
     in a real app works — HTML holds the shell, JS holds the data.

     Zebra note: even:bg-gray-50 works again with ZERO JS help because
     each render produces exactly 8 fresh rows — nth-child parity is
     correct by construction (the old filtered-hidden-row bug is gone).
     ============================================================================== -->

<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
  <!-- Page header: title left, primary action right. flex-wrap so the button
       drops below the title on very narrow phones instead of squeezing it. -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Team members</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage roles, access and status.</p>
    </div>
    <button
      type="button"
      data-invite
      class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-700 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:outline-none active:scale-[0.98]"
    >
      + Invite member
    </button>
  </div>

  <!-- =========================================================================
         TOOLBAR — search + chips.
         flex-col sm:flex-row: stacks vertically on phones (search gets full
         width — good for thumbs), one row ≥640px.
         sm:justify-between pushes chips to the far right.
         ====================================================================== -->
  <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <!-- SEARCH INPUT — icon INSIDE the field.
         relative on the wrapper = positioning context for the icon.
         pl-9 on the input = padding-left 2.25rem, so typed text starts AFTER
         the icon instead of underneath it. (Classic inset-icon pattern.) -->
    <div class="relative w-full sm:max-w-xs">
      <span class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-gray-400" aria-hidden="true">
        🔍
      </span>
      <!-- pointer-events-none on the icon span (also above): clicks pass
           through to the input below — otherwise the icon swallows them. -->
      <input
        type="search"
        data-table-search
        placeholder="Search name or email…"
        aria-label="Search team members"
        class="w-full rounded-xl border border-gray-300 bg-white py-2 pr-4 pl-9 text-sm transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-900 dark:placeholder:text-gray-500"
      />
      <!-- focus pair: border-color shift + 2px ring glow.
           focus:outline-none removes the browser default outline BECAUSE the
           ring replaces it — never remove focus styles without a replacement. (a11y) -->
    </div>

    <!-- STATUS CHIPS — toggle-style filters.
         Each button: data-status-filter="all|active|inactive".
         JS moves the "active" tint classes between chips.
         Same visual language as pricing/range pills: rounded-full, text-sm. -->
    <div class="flex flex-wrap gap-2" role="group" aria-label="Filter by status">
      <button
        type="button"
        data-status-filter="all"
        aria-pressed="true"
        class="rounded-full border border-brand-200 bg-brand-50 px-3.5 py-1.5 text-xs font-semibold text-brand-700 transition hover:bg-brand-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:border-brand-800 dark:bg-brand-900/30 dark:text-brand-300"
      >
        All
      </button>
      <button
        type="button"
        data-status-filter="active"
        aria-pressed="false"
        class="rounded-full border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-semibold text-gray-600 transition hover:bg-gray-50 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:border-gray-700 dark:bg-gray-900 dark:text-gray-400"
      >
        Active
      </button>
      <button
        type="button"
        data-status-filter="inactive"
        aria-pressed="false"
        class="rounded-full border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-semibold text-gray-600 transition hover:bg-gray-50 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:border-gray-700 dark:bg-gray-900 dark:text-gray-400"
      >
        Inactive
      </button>
    </div>
  </div>

  <!-- =========================================================================
         TABLE CARD
         overflow-x-auto = the ONE place wide content is allowed to scroll.
         On phones the table exceeds the column → horizontal scroll INSIDE
         this box, page itself never grows sideways. Pair with min-w-full
         on the table: it may shrink to container, and GROW past it.
         ====================================================================== -->
  <div
    data-table-card
    class="mt-4 overflow-x-auto rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900"
  >
    <table class="min-w-full text-left text-sm">
      <!-- thead — bg-gray-50 caps the header; text-xs uppercase = table
           convention (headers smaller but louder via weight/tracking). -->
      <thead>
        <tr class="border-b border-gray-200 bg-gray-50 text-xs font-semibold uppercase tracking-wide text-gray-500 dark:border-gray-800 dark:bg-gray-800/60 dark:text-gray-400">
          <th scope="col" class="px-5 py-3">Member</th>
          <th scope="col" class="px-5 py-3">Role</th>
          <th scope="col" class="px-5 py-3">Status</th>
          <th scope="col" class="px-5 py-3">Team</th>
          <th scope="col" class="px-5 py-3">Last active</th>
          <th scope="col" class="px-5 py-3 text-right">Actions</th>
          <!-- scope="col" tells screen readers this header labels the COLUMN —
               when a cell is announced, its header comes with it. (a11y) -->
        </tr>
      </thead>

      <!-- Rows injected here by initTable() — see src/main.js. -->
      <tbody data-table-rows class="divide-y divide-gray-100 dark:divide-gray-800"></tbody>

      <!-- NO-RESULTS state — its OWN tbody so every initTable() rewrite of
           the rows tbody above leaves this block intact (only its `hidden`
           class flips). Two <tbody>s in one <table> is valid HTML.
           Follows the empty-state rules from states.html:
           icon (what happened) → heading → motivation → ONE clear action.
           "Clear filters" is the escape hatch; without it a filter combo is
           a dead end and users just leave. colspan spans all 6 columns so
           the block centres across the full width. aria-live is on the count
           line below — announcing THIS block too would double-speak to
           screen readers. -->
      <tbody id="table-empty" class="hidden">
        <tr>
          <td colspan="6" class="px-5 py-12">
            <div class="flex flex-col items-center text-center">
              <span
                class="flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 text-2xl dark:bg-gray-800"
                aria-hidden="true"
                >🔍</span
              >
              <p class="mt-3 text-sm font-semibold text-gray-900 dark:text-white">
                No members match
              </p>
              <p class="mt-1 max-w-sm text-sm text-gray-500 dark:text-gray-400">
                Try a different name, email or role — or clear the filters to
                see all 42 members again.
              </p>
              <button
                type="button"
                data-table-clear
                class="mt-4 rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-700 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:outline-none active:scale-[0.98]"
              >
                Clear filters
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- =========================================================================
         PAGINATION — count + page buttons are REBUILT by JS on every state
         change (search, chip, page). aria-live="polite" on the count means
         screen readers hear "Showing 9–16 of 42 members" after each filter
         WITHOUT being interrupted mid-sentence. (a11y)
         flex-col sm:justify-between: info + buttons stack on phones, split
         on wide screens.
         ====================================================================== -->
  <div class="mt-4 flex flex-col items-center justify-between gap-3 rounded-2xl border border-gray-200 bg-white px-4 py-3 sm:flex-row dark:border-gray-800 dark:bg-gray-900">
    <p data-table-count aria-live="polite" class="text-sm text-gray-500 dark:text-gray-400"></p>

    <nav data-table-pages class="flex items-center gap-1.5" aria-label="Pagination">
      <!-- Buttons rendered by initTable() — prev, numbered pages, next. -->
    </nav>
  </div>
</div>
