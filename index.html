<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind v4 Pattern Library</title>
  </head>

  <!--
    APP SHELL
    ========
    This page is the persistent chrome of the demo SPA:
      sidebar (this file)  →  always visible, switches content
      <main id="view">     →  filled by src/main.js with src/views/*.html

    The shell never reloads — only the contents of #view change.
    Lesson: this is how every real SPA (React/Vue/Svelte) works too;
    frameworks only make the same DOM swap faster with a virtual DOM.
  -->

  <!--
    BODY = horizontal flex row.
      flex           children sit side by side (sidebar | content)
      min-h-screen   always at least viewport height (h-screen = exactly)
      bg-gray-50 / dark:bg-gray-950  page tone, flips with .dark on <html>
  -->
  <body class="flex min-h-screen bg-gray-50 text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100">
    <!-- =============================================================================
         MOBILE TOP BAR — only visible below lg (the sidebar's breakpoint).
         lg:hidden = display:none at ≥1024px.
         Fixing the layout problem: on phones there is no room for a sidebar,
         so navigation lives behind a hamburger that opens a "drawer".
         ============================================================================== -->
    <header class="fixed inset-x-0 top-0 z-30 flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3 lg:hidden dark:border-gray-800 dark:bg-gray-900">
      <!-- aria-label tells screen readers what the icon-only button DOES.
           Visible text is hidden with sr-only-like visuals; never ship an
           unlabeled button. (a11y) -->
      <button
        id="drawer-open"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="sidebar"
        class="rounded-lg p-2 text-gray-500 transition hover:bg-gray-100 hover:text-gray-900
               focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none
               dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
      >
        <!-- Hamburger drawn with 3 spans — no icon library needed.
             w-5 = width 1.25rem; h-0.5 = 2px line; gap between lines = space-y via flex-col gap -->
        <span class="flex w-5 flex-col gap-1.5" aria-hidden="true">
          <!-- aria-hidden="true" = decorative, screen readers skip it (a11y) -->
          <span class="h-0.5 w-full rounded bg-current"></span>
          <span class="h-0.5 w-full rounded bg-current"></span>
          <span class="h-0.5 w-full rounded bg-current"></span>
        </span>
      </button>

      <span class="text-sm font-semibold text-brand-600 dark:text-brand-400">Tailwind v4 Library</span>

      <!-- Small-screen dark toggle (the sidebar's copy is hidden below lg). -->
      <button
        id="theme-toggle-mobile"
        type="button"
        aria-label="Toggle dark mode"
        class="rounded-lg p-2 text-gray-500 transition hover:bg-gray-100
               focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none
               dark:text-gray-400 dark:hover:bg-gray-800"
      >
        <span aria-hidden="true">◐</span>
      </button>
    </header>

    <!-- =============================================================================
         SIDEBAR DRAWER
         Positioning explained:
           fixed  = out of document flow, pinned to viewport (survives scrolling)
                    used on mobile so content can slide underneath
           lg:sticky + lg:top-0  = from 1024px up it returns to normal flow but
                    sticks to the top while the page scrolls — like a rail.
           -translate-x-full = moved 100% of its own width to the LEFT (off-screen).
                    lg:translate-x-0 parks it back in place at the breakpoint.
           transform is GPU-composited → animates smoother than left/margin.
           z-40 = stacking order: above content (z auto) but below nothing yet.
         ============================================================================== -->
    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-gray-200 bg-white transition-transform duration-200
             lg:sticky lg:top-0 lg:h-screen lg:translate-x-0
             dark:border-gray-800 dark:bg-gray-900"
      aria-label="Page type navigation"
    >
      <!-- Sidebar brand area -->
      <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-800">
        <!-- font-display token (from @theme in style.css) → this exact font stack -->
        <p class="font-semibold tracking-tight">Tailwind v4 Library</p>
        <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">Real-world page patterns</p>
      </div>

      <!-- Cmd/Ctrl+K palette trigger. <kbd> is the semantic key element —
           styled like a keycap, announced as "keyboard key" by some AT. -->
      <div class="px-3 pt-3">
        <button
          id="palette-open"
          type="button"
          class="flex w-full items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-500 transition hover:border-gray-300 hover:text-gray-700 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:border-gray-600 dark:hover:text-gray-300"
        >
          <span aria-hidden="true">⌕</span>
          Jump to view…
          <kbd
            class="ml-auto rounded border border-gray-300 bg-white px-1.5 py-0.5 font-mono text-[10px] text-gray-500 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-400"
            >⌘K</kbd
          >
        </button>
      </div>

      <!--
        NAVIGATION
        Each button carries data-view="<id>" — src/main.js listens for clicks
        on the whole nav (event delegation) and swaps #view's HTML.
        One listener for N buttons instead of N listeners = cheaper,
        and keeps working for buttons added in later phases without JS edits.

        Grouped headings mirror how real dashboards organise long navs:
        a flat list of 11 links is hard to scan; 4 labelled groups are easy.
      -->
      <nav class="flex-1 overflow-y-auto px-3 py-4" aria-label="Views">
        <!-- GROUP: Marketing -->
        <p class="px-2 pb-1 text-[11px] font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">
          Marketing
        </p>
        <ul class="space-y-1">
          <li>
            <!--
              Active state pattern (applied/removed by JS):
                active    = bg-brand-50 text-brand-700   (tinted rail item)
                default   = text-gray-600 hover:bg-gray-100
              aria-current="page" is the SCREEN READER version of "active" —
              without it, visually-abled users see the highlight, blind users hear nothing. (a11y)
            -->
            <button
              type="button"
              data-view="landing"
              aria-current="page"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium transition
                     bg-brand-50 text-brand-700
                     hover:bg-brand-100
                     focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none
                     dark:bg-brand-900/30 dark:text-brand-300 dark:hover:bg-brand-900/50"
            >
              <span aria-hidden="true">🚀</span>
              Landing / Hero
            </button>
          </li>
        </ul>

        <!-- GROUP: Applications -->
        <p class="px-2 pb-1 pt-4 text-[11px] font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">
          Applications
        </p>
        <ul class="space-y-1">
          <li>
            <button
              type="button"
              data-view="dashboard"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">📊</span>
              SaaS Dashboard
            </button>
          </li>
          <li>
            <button
              type="button"
              data-view="table"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">🗄️</span>
              Data Table
            </button>
          </li>
          <!-- chat + settings arrive in Phase 4 -->
          <li>
            <button
              type="button"
              data-view="chat"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">💬</span>
              AI Chat
            </button>
          </li>
          <li>
            <button
              type="button"
              data-view="settings"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">⚙️</span>
              Settings
            </button>
          </li>
          <li>
            <button
              type="button"
              data-view="states"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">🧪</span>
              Loading &amp; States
            </button>
          </li>
        </ul>

        <!-- GROUP: Forms -->
        <p class="px-2 pb-1 pt-4 text-[11px] font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">
          Forms
        </p>
        <ul class="space-y-1">
          <li>
            <button
              type="button"
              data-view="checkout"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">💳</span>
              Checkout &amp; Billing
            </button>
          </li>
          <li>
            <button
              type="button"
              data-view="auth"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">🔐</span>
              Authentication
            </button>
          </li>
        </ul>

        <!-- GROUP: Content -->
        <p class="px-2 pb-1 pt-4 text-[11px] font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">
          Content
        </p>
        <ul class="space-y-1">
          <li>
            <button
              type="button"
              data-view="shop"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">🛍️</span>
              Shop
            </button>
          </li>
          <li>
            <button
              type="button"
              data-view="blog"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">📝</span>
              Blog
            </button>
          </li>
          <li>
            <button
              type="button"
              data-view="faq"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-gray-600 transition hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none dark:text-gray-400 dark:hover:bg-gray-800"
            >
              <span aria-hidden="true">❓</span>
              FAQ
            </button>
          </li>
        </ul>
      </nav>

      <!-- Sidebar footer: dark-mode toggle + phase hint -->
      <div class="border-t border-gray-200 p-3 dark:border-gray-800">
        <button
          id="theme-toggle"
          type="button"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-gray-600 transition
                 hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none
                 dark:text-gray-400 dark:hover:bg-gray-800"
        >
          <span aria-hidden="true">◐</span>
          Toggle dark mode
        </button>
        <p class="px-3 pt-2 text-[11px] text-gray-400 dark:text-gray-500">11 views · all phases complete</p>
      </div>
    </aside>

    <!--
      BACKDROP (scrim): dims the page behind the open drawer on mobile.
      fixed inset-0 = covers the whole viewport.
      hidden + lg:hidden below = JS toggles the `hidden` class;
      lg:hidden forces it off entirely at desktop widths (no drawer, no scrim).
      Clicking it closes the drawer — expected mobile UX. (a11y)
    -->
    <div
      id="drawer-backdrop"
      class="fixed inset-0 z-30 hidden bg-black/50 lg:hidden"
      role="presentation"
    ></div>

    <!--
      CONTENT COLUMN
        flex-1  = take all remaining horizontal space after the sidebar
        min-w-0 = opt OUT of flexbox's automatic min-width:auto —
                  without it, wide children (tables, long words) would blow
                  the layout sideways instead of scrolling internally.
        The mobile top bar is fixed, so main needs top padding below lg
        to clear it: pt-14 lg:pt-0 (14 × 0.25rem = 3.5rem ≈ bar height).
    -->
    <main id="view" class="min-w-0 flex-1 pt-14 lg:pt-0" tabindex="-1">
      <!-- View HTML is injected here by src/main.js. tabindex="-1" lets
           programmatic focus land here after a view switch (a11y: keyboard
           users continue from the new content, not the old nav position). -->
    </main>

    <!--
      COMMAND PALETTE (⌘K / Ctrl+K)
      Shell-level dialog — NOT inside #view — because the shortcut must work
      on every screen. Two layers: backdrop (click to dismiss) + card.
      Hidden entirely with .hidden when closed (no focusable children leak
      into the tab order). JS lives in src/main.js.
    -->
    <div
      id="palette"
      class="fixed inset-0 z-50 hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Command palette"
    >
      <div id="palette-backdrop" class="absolute inset-0 bg-black/50"></div>
      <div
        class="relative mx-auto mt-[15vh] w-[calc(100%-2rem)] max-w-lg overflow-hidden rounded-2xl border bg-white shadow-2xl dark:border-gray-800 dark:bg-gray-900"
      >
        <!-- aria-controls links input → list for AT; the list itself is
             role=listbox with role=option children (combobox pattern lite) -->
        <input
          id="palette-input"
          type="text"
          autocomplete="off"
          placeholder="Jump to a view…"
          aria-label="Search views"
          aria-controls="palette-list"
          class="w-full border-b bg-transparent px-4 py-3.5 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none dark:text-white dark:placeholder:text-gray-500"
        />
        <ul
          id="palette-list"
          role="listbox"
          aria-label="Views"
          class="max-h-72 overflow-y-auto p-2"
        >
          <!-- Items rendered by JS from the nav's own data-view buttons -->
        </ul>
        <div
          class="flex gap-4 border-t px-4 py-2 text-[11px] text-gray-400 dark:border-gray-800 dark:text-gray-500"
        >
          <span><kbd class="font-mono">↑↓</kbd> navigate</span>
          <span><kbd class="font-mono">↵</kbd> open</span>
          <span><kbd class="font-mono">Esc</kbd> close</span>
        </div>
      </div>
    </div>

    <!--
      TOAST HOST — lives in the shell, outside #view, so messages SURVIVE
      view switches (a toast fired from Shop still fades while you're on FAQ).
      aria-live="polite" = screen readers announce each new child WITHOUT
      interrupting whatever they're reading. (a11y)
      Nothing is rendered here until src/main.js showToast() appends.
    -->
    <div
      id="toast-host"
      aria-live="polite"
      class="pointer-events-none fixed right-4 bottom-4 z-50 flex flex-col items-end gap-2"
    ></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
