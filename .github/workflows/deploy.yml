name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]

  # Manual "Run workflow" button in GitHub Actions
  workflow_dispatch:

# Permissions required to publish an artifact to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid simultaneous deploys from multiple runs (latest wins)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build with Vite
        run: bun run build

      - name: Upload static files as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite outputs built assets to `dist/` by default
          path: "./dist"

  e2e:
    # A separate job so a browser flake never blocks the build artifact, but
    # the deploy below still waits on it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # Only deploy if we're on the main branch
    if: github.ref == 'refs/heads/main'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
